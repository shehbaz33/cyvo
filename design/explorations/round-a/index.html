<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyvo · Round A directions</title>
<style>
  body { margin: 0; background: #2f2b25; color: #f0eae3; font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 20px 24px 8px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: #a6a199; max-width: 80ch; }
  .toggle { margin-top: 12px; display: flex; gap: 8px; }
  .toggle button { background: transparent; color: #f0eae3; border: 1px solid #59544e; border-radius: 99px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .toggle button[aria-pressed="true"] { background: #e3a23b; color: #1c1812; border-color: #e3a23b; }
  .row { display: flex; gap: 24px; padding: 16px 24px 32px; overflow-x: auto; }
  figure { margin: 0; flex: none; }
  figcaption { margin-bottom: 8px; }
  figcaption b { display: block; font-size: 16px; }
  figcaption span { color: #a6a199; font-size: 13px; }
  figcaption a { color: #e3a23b; font-size: 13px; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 24px; background: #fff; display: block; }
  body.desk iframe { width: 1100px; height: 760px; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1>Cyvo · Round A: three directions</h1>
  <p>Same copy, same palette (warm paper, ink, marigold), same rule: serif headlines, system sans body. Each differs in structure and mood. Shown at phone width first, because that is where doctors will open it.</p>
  <div class="toggle">
    <button aria-pressed="true" onclick="set(false,this)">Phone 390px</button>
    <button aria-pressed="false" onclick="set(true,this)">Desktop</button>
  </div>
</header>
<div class="row">
  <figure>
    <figcaption><b>A · Paper front desk</b><span>Editorial, calm, line-art team portraits. Newsreader.</span> <a href="a-paper-desk.html" target="_blank">open ↗</a></figcaption>
    <iframe src="a-paper-desk.html" title="Direction A"></iframe>
  </figure>
  <figure>
    <figcaption><b>B · After hours</b><span>Night hero with an 11 pm clock, big honest numeral, shift board. Fraunces.</span> <a href="b-after-hours.html" target="_blank">open ↗</a></figcaption>
    <iframe src="b-after-hours.html" title="Direction B"></iframe>
  </figure>
  <figure>
    <figcaption><b>C · Clinic register</b><span>Appointment-book ruled pages, timestamp margin, duty roster. Instrument Serif.</span> <a href="c-register.html" target="_blank">open ↗</a></figcaption>
    <iframe src="c-register.html" title="Direction C"></iframe>
  </figure>
</div>
<script>
  function set(desk, btn) {
    document.body.classList.toggle('desk', desk);
    document.querySelectorAll('.toggle button').forEach(b => b.setAttribute('aria-pressed', b === btn));
  }
</script>
</body>
</html>
