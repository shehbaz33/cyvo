<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cyvo OG card</title>
<!-- Source for images/og.jpg (1200×630). Re-render with headless Chrome after edits. -->
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fbf6f4; color: #141c30; font-family: system-ui, sans-serif; position: relative; }
  .D { font-family: "League Gothic", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: 0.005em; font-weight: 400; }
  .wm { position: absolute; left: 64px; top: 52px; font-size: 44px; line-height: 1; }
  .wm span { color: #c23e14; }
  .sticker { position: absolute; left: 64px; top: 128px; background: #ea5a2e; color: #141c30; font: 700 18px/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; padding: 9px 16px; border-radius: 99px; transform: rotate(-6deg); }
  h1 { position: absolute; left: 64px; top: 186px; width: 540px; font-size: 84px; line-height: .92; }
  h1 em { font-style: normal; color: #c23e14; }
  .sub { position: absolute; left: 64px; bottom: 52px; width: 520px; font-size: 24px; line-height: 1.35; color: #5d6175; }
  .tiles { position: absolute; right: 56px; top: 64px; display: grid; grid-template-columns: repeat(2, 236px); gap: 14px; }
  .tiles img { width: 236px; height: 242px; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="wm D">cyvo<span>.</span></div>
  <div class="sticker">Open at 11 pm</div>
  <h1 class="D">Your clinic answers WhatsApp at 11 pm. <em>Even when you don’t.</em></h1>
  <p class="sub">A team of front desk specialists · Set up in person in Mumbai</p>
  <div class="tiles">
    <img src="../../images/front-desk.webp" alt="">
    <img src="../../images/reminder.webp" alt="">
    <img src="../../images/reviews.webp" alt="">
    <img src="../../images/recall.webp" alt="">
  </div>
</body>
</html>
